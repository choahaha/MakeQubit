<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>답안지 — MakeQubit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

  <!-- 입장하지 않았거나 학생 코드로 들어온 경우 -->
  <div id="gate" class="hidden min-h-screen flex items-center justify-center p-6">
    <div class="bg-white border border-slate-200 rounded-2xl p-8 max-w-md text-center space-y-3">
      <span class="material-icons-round text-4xl text-slate-300">lock</span>
      <h1 class="text-lg font-bold">교사용 화면이에요</h1>
      <p id="gate-message" class="text-sm text-slate-500 leading-relaxed"></p>
      <a href="/" class="inline-block mt-2 text-sm font-bold text-primary hover:underline">입장 화면으로</a>
    </div>
  </div>

  <div id="sheet" class="hidden">
    <header class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-slate-200 print:static print:bg-white">
      <div class="max-w-4xl mx-auto px-5 py-3.5 flex items-center gap-3">
        <a href="/lessons.html" class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center shrink-0 print:hidden">
          <span class="material-icons-round text-white text-lg">menu_book</span>
        </a>
        <div class="min-w-0">
          <h1 class="font-bold leading-tight">답안지</h1>
          <p class="text-xs text-slate-500">레슨 35개의 정답 코드와 힌트</p>
        </div>
        <span id="who" class="ml-auto text-xs font-mono bg-amber-100 text-amber-700 px-2.5 py-1 rounded-full print:hidden"></span>
        <button id="btn-print"
          class="print:hidden text-xs font-bold text-slate-500 hover:text-primary transition flex items-center gap-1 px-2.5 py-1.5 rounded-lg hover:bg-slate-100">
          <span class="material-icons-round text-sm">print</span>
          인쇄
        </button>
      </div>
      <nav id="jump" class="max-w-4xl mx-auto px-5 pb-3 flex gap-1.5 overflow-x-auto print:hidden"></nav>
    </header>

    <main id="content" class="max-w-4xl mx-auto px-5 py-6 space-y-8"></main>

    <footer class="max-w-4xl mx-auto px-5 pb-12 print:hidden">
      <p class="text-xs text-slate-400 leading-relaxed">
        이 화면은 학생 메뉴에 링크되어 있지 않지만, 정답은 원래 학생 브라우저에도
        내려갑니다(제출 후 해설을 보여주기 위해). 학생이 개발자 도구로 찾아볼 수는
        있다는 뜻이라, 이 화면을 가려 둔 것은 우연히 마주치지 않게 하려는 것이지
        차단이 아닙니다.
      </p>
    </footer>
  </div>

  <script type="module" src="/src/teacher.js"></script>
</body>
</html>
