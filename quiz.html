<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>MakeQubit — 형성평가</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
  <script type="module" src="/src/quiz.js"></script>
  <style>body { opacity: 0; } body.ready { opacity: 1; transition: opacity 0.15s; }</style>
</head>
<body class="bg-slate-50 font-display text-slate-800 min-h-screen flex flex-col">

  <header class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-5 shrink-0">
    <div class="flex items-center gap-3 min-w-0">
      <a href="/lessons.html" title="실습 목차"
         class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white shrink-0 hover:bg-primary-dark transition">
        <span class="material-icons-round text-lg">quiz</span>
      </a>
      <div class="min-w-0">
        <div class="flex items-center gap-2">
          <span id="quiz-meta" class="text-[10px] font-bold uppercase tracking-wider text-primary bg-primary/10 px-1.5 py-0.5 rounded"></span>
          <h1 id="quiz-title" class="font-bold text-sm truncate">형성평가</h1>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span id="quiz-progress" class="text-[11px] font-mono text-slate-500"></span>
      <span id="participant-chip" class="text-xs font-mono bg-slate-100 text-slate-500 px-2.5 py-1 rounded-full"></span>
    </div>
  </header>

  <main class="flex-1 px-6 py-8 max-w-2xl w-full mx-auto">

    <div id="intro" class="hidden">
      <h2 id="intro-title" class="text-2xl font-extrabold tracking-tight"></h2>
      <p class="mt-3 text-slate-600 leading-relaxed">
        이번 차시에서 배운 걸 확인하는 문제야. 회로를 읽는 문제, 결과를 예상하는 문제,
        잘못된 코드를 찾는 문제 세 개가 나와.
      </p>
      <p class="mt-2 text-sm text-slate-500 leading-relaxed">
        점수는 성적에 안 들어가. 틀려도 괜찮으니 왜 그렇게 생각했는지에 집중해 봐.
        고르면 바로 답과 설명이 나와.
      </p>
      <button id="btn-start"
        class="mt-6 bg-primary hover:bg-primary-dark text-white font-bold px-6 py-3 rounded-xl transition-colors flex items-center gap-2">
        <span class="material-icons-round text-lg">play_arrow</span> 시작하기
      </button>
    </div>

    <div id="item" class="hidden"></div>

    <div id="done" class="hidden text-center py-10">
      <span class="material-icons-round text-5xl text-accent-green">emoji_events</span>
      <h2 class="mt-3 text-2xl font-extrabold">다 풀었어!</h2>
      <p id="done-score" class="mt-2 font-mono text-lg text-slate-600"></p>
      <div id="done-review" class="mt-6 space-y-2 text-left"></div>
      <a href="/lessons.html"
        class="inline-flex mt-8 bg-primary hover:bg-primary-dark text-white font-bold px-6 py-3 rounded-xl transition-colors items-center gap-2">
        <span class="material-icons-round text-lg">list</span> 목차로 돌아가기
      </a>
    </div>

  </main>

</body>
</html>
