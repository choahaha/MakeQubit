<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>MakeQubit — 형성평가</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
  <script type="module" src="/src/quiz.js"></script>
  <style>body { opacity: 0; } body.ready { opacity: 1; transition: opacity 0.15s; }</style>
</head>
<body class="bg-slate-50 font-display text-slate-800 min-h-screen flex flex-col">

  <header class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-5 shrink-0">
    <div class="flex items-center gap-3 min-w-0">
      <a href="/lessons.html" title="실습 목차"
         class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white shrink-0 hover:bg-primary-dark transition">
        <span class="material-icons-round text-lg">quiz</span>
      </a>
      <div class="min-w-0">
        <div class="flex items-center gap-2">
          <span id="quiz-meta" class="text-[10px] font-bold uppercase tracking-wider text-primary bg-primary/10 px-1.5 py-0.5 rounded"></span>
          <h1 id="quiz-title" class="font-bold text-sm truncate">형성평가</h1>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div id="quiz-steps" class="flex items-center gap-1.5"></div>
      <span id="participant-chip" class="text-xs font-mono bg-slate-100 text-slate-500 px-2.5 py-1 rounded-full"></span>
    </div>
  </header>

  <main class="flex-1 flex flex-col px-6 pt-14 pb-16 max-w-3xl w-full mx-auto">

    <div id="intro" class="hidden text-center my-auto">
      <p id="intro-meta" class="text-xs font-bold uppercase tracking-[0.14em] text-primary"></p>
      <h2 class="mt-2 text-3xl sm:text-4xl font-extrabold tracking-tight">배운 걸 확인해 보자</h2>

      <div class="mt-14 relative mx-auto w-full max-w-xl px-1">
        <div class="track-rail absolute top-[17px] h-[3px] bg-slate-200 rounded-full"></div>
        <div id="intro-track" class="relative flex justify-between"></div>
      </div>

      <p id="intro-note" class="track-cta opacity-0 mt-14 text-[15px] leading-relaxed text-slate-600">
        답을 고르면 바로 맞았는지 알려줄게.<br class="hidden sm:block"/>
        점수는 성적에 안 들어가니까 편하게 풀어도 돼.
      </p>

      <button id="btn-start"
        class="track-cta opacity-0 mt-7 mx-auto bg-primary hover:bg-primary-dark text-white font-bold text-[15px]
               px-8 py-3.5 rounded-xl transition-colors inline-flex items-center gap-2">
        <span class="material-icons-round text-xl">play_arrow</span>
        <span id="start-label">시작하기</span>
      </button>
    </div>

    <div id="item" class="hidden"></div>

    <div id="reflect" class="hidden">
      <span class="inline-block text-[11px] font-bold px-2 py-1 rounded-full bg-slate-100 text-slate-600">되돌아보기</span>
      <h2 class="mt-3 text-2xl font-extrabold tracking-tight leading-snug">마지막으로 하나만</h2>
      <p id="reflect-prompt" class="mt-3 text-[17px] text-slate-700 leading-relaxed"></p>
      <textarea id="reflect-answer" rows="5"
        class="mt-4 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm leading-relaxed
               focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition resize-none"
        placeholder="정답이 있는 질문은 아니야. 생각한 대로 써 줘"></textarea>
      <div class="mt-4 flex gap-2">
        <button id="reflect-skip"
          class="flex-1 text-sm font-bold text-slate-500 hover:text-slate-700 py-3 rounded-xl hover:bg-slate-100 transition">
          건너뛰기
        </button>
        <button id="reflect-submit"
          class="flex-1 bg-primary hover:bg-primary-dark text-white font-bold text-sm py-3 rounded-xl transition-colors">
          다 했어
        </button>
      </div>
    </div>

    <div id="done" class="hidden text-center my-auto">
      <span class="material-icons-round text-5xl text-accent-green">emoji_events</span>
      <h2 class="mt-3 text-3xl font-extrabold tracking-tight">다 풀었어!</h2>
      <p id="done-score" class="mt-2 font-mono text-lg text-slate-600"></p>
      <div id="done-review" class="mt-6 space-y-2 text-left"></div>
      <a href="/lessons.html"
        class="inline-flex mt-8 bg-primary hover:bg-primary-dark text-white font-bold px-6 py-3 rounded-xl transition-colors items-center gap-2">
        <span class="material-icons-round text-lg">list</span> 목차로 돌아가기
      </a>
    </div>

  </main>

</body>
</html>
