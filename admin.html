<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>MakeQubit — 연구자 화면</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
  <script type="module" src="/src/admin.js"></script>
  <style>body { opacity: 0; } body.ready { opacity: 1; transition: opacity 0.15s; }</style>
</head>
<body class="bg-slate-50 font-display text-slate-800 min-h-screen flex flex-col">

  <header class="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-6 shrink-0">
    <div class="flex items-center gap-3">
      <a href="/" class="w-8 h-8 bg-slate-800 rounded-lg flex items-center justify-center text-white">
        <span class="material-icons-round text-lg">insights</span>
      </a>
      <h1 class="font-extrabold text-lg tracking-tight">연구자 화면</h1>
      <span id="scope-chip" class="hidden text-xs font-mono bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full"></span>
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-refresh" class="hidden text-xs font-bold text-slate-500 hover:text-primary transition flex items-center gap-1 px-2.5 py-1.5 rounded-lg hover:bg-slate-50">
        <span class="material-icons-round text-sm">refresh</span> 새로고침
      </button>
      <button id="btn-logout" class="hidden text-xs font-bold text-slate-500 hover:text-accent-red transition px-2.5 py-1.5 rounded-lg hover:bg-slate-50">
        잠그기
      </button>
    </div>
  </header>

  <!-- ===== 토큰 입력 ===== -->
  <section id="gate" class="flex-1 flex items-center justify-center px-6 py-16">
    <form id="gate-form" class="w-full max-w-sm bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
      <h2 class="font-bold text-lg">잠겨 있어요</h2>
      <p class="mt-1 text-sm text-slate-500 leading-relaxed">
        학생 데이터를 보려면 관리자 토큰이 필요해요.
      </p>
      <input id="token" type="password" autocomplete="current-password"
        class="mt-4 w-full rounded-xl border border-slate-200 px-4 py-3 font-mono
               focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition"
        placeholder="ADMIN_TOKEN"/>
      <p id="gate-error" class="hidden mt-2 text-sm text-accent-red font-medium"></p>
      <button type="submit" class="mt-3 w-full bg-primary hover:bg-primary-dark text-white font-bold py-3 rounded-xl transition-colors">
        열기
      </button>
      <p class="mt-4 text-[11px] leading-relaxed text-slate-500">
        토큰은 이 브라우저 탭에만 남고, 탭을 닫으면 사라져요.
      </p>
    </form>
  </section>

  <!-- ===== 대시보드 ===== -->
  <main id="dash" class="hidden flex-1 px-6 py-6 max-w-[1400px] w-full mx-auto space-y-6">

    <div id="totals" class="grid grid-cols-2 md:grid-cols-5 gap-3"></div>

    <section class="bg-white rounded-2xl border border-slate-200 p-5">
      <div class="flex items-baseline justify-between mb-1">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">참여자 × 레슨</h2>
        <div class="flex items-center gap-3 text-[11px] text-slate-500">
          <span class="flex items-center gap-1"><i class="w-2.5 h-2.5 rounded-sm bg-slate-100 border border-slate-200"></i>미시작</span>
          <span class="flex items-center gap-1"><i class="w-2.5 h-2.5 rounded-sm bg-amber-50 border border-amber-300"></i>시도중</span>
          <span class="flex items-center gap-1"><i class="w-2.5 h-2.5 rounded-sm bg-green-50 border border-green-400"></i>통과</span>
          <span class="flex items-center gap-1"><i class="w-1.5 h-1.5 rounded-full bg-primary"></i>제출</span>
          <span class="flex items-center gap-1"><i class="w-1.5 h-1.5 rounded-full bg-secondary"></i>힌트</span>
        </div>
      </div>
      <p class="text-[11px] text-slate-500 mb-3">칸 안의 숫자는 실행 횟수. 학생 이름을 누르면 궤적이 열려요.</p>
      <div class="overflow-x-auto"><div id="grid"></div></div>
    </section>

    <section class="bg-white rounded-2xl border border-slate-200 p-5">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">레슨별 요약</h2>
      <div class="overflow-x-auto"><table id="lesson-table" class="w-full text-sm"></table></div>
    </section>

  </main>

  <!-- ===== 드릴다운 패널 ===== -->
  <div id="panel" class="hidden fixed inset-0 z-50 flex justify-end">
    <div id="panel-backdrop" class="absolute inset-0 bg-slate-900/30 backdrop-blur-sm"></div>
    <div class="relative bg-slate-50 w-full max-w-3xl h-full overflow-y-auto shadow-2xl">
      <div class="sticky top-0 bg-white border-b border-slate-200 px-6 h-14 flex items-center justify-between z-10">
        <h2 id="panel-title" class="font-bold"></h2>
        <button id="panel-close" class="w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center transition">
          <span class="material-icons-round text-slate-500">close</span>
        </button>
      </div>
      <div id="panel-body" class="p-6 space-y-5"></div>
    </div>
  </div>

</body>
</html>
